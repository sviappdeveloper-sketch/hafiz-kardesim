name: Derle (Android)
# (Depo açık: GitHub Actions dakikaları sınırsız.)

# Derleme takvimi: ayın 1'i ve 15'i sabah (Türkiye 08:00) — yalnızca son derlemeden beri kod
# değiştiyse. Ayrıca elle (Actions › Run workflow) ya da commit mesajında [derle] yazılınca derlenir.
# Çıktılar "apk" dalına konur; hata olursa ayrıntılar "log" dalına yazılır.
on:
  schedule:
    - cron: '0 5 1,15 * *'
  push:
    branches: [main]
    paths: ['lib/**', 'test/**', 'assets/**', 'tool/**', 'android-keys/**', 'pubspec.yaml', '.github/workflows/derle.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Takvimli çalışmada son derlemeden beri değişiklik yoksa derleme yapılmaz.
  kontrol:
    runs-on: ubuntu-latest
    outputs:
      derle: ${{ steps.k.outputs.derle }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: k
        env:
          OLAY: ${{ github.event_name }}
          MESAJ: ${{ github.event.head_commit.message }}
        run: |
          if [ "$OLAY" = "workflow_dispatch" ]; then echo "derle=1" >> $GITHUB_OUTPUT; exit 0; fi
          if [ "$OLAY" = "push" ]; then
            case "$MESAJ" in *"[derle]"*) echo "derle=1" >> $GITHUB_OUTPUT;; *) echo "derle=0" >> $GITHUB_OUTPUT;; esac
            exit 0
          fi
          son=$(git show origin/apk:SURUM.txt 2>/dev/null | sed -n 's/.*commit: \([0-9a-f]*\).*/\1/p')
          if [ -n "$son" ] && git cat-file -e "$son" 2>/dev/null && git diff --quiet "$son" HEAD -- lib test assets tool android-keys pubspec.yaml; then
            echo "Son derlemeden ($son) beri değişiklik yok."
            echo "derle=0" >> $GITHUB_OUTPUT
          else
            echo "derle=1" >> $GITHUB_OUTPUT
          fi

  build:
    needs: kontrol
    if: needs.kontrol.outputs.derle == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Disk alanı aç
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/lib/node_modules /opt/microsoft /opt/google/chrome /usr/local/share/chromium || true
          sudo docker image prune -af >/dev/null 2>&1 || true

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Platform dosyalarını oluştur
        run: flutter create --org com.sviapp --project-name hafiz_kardesim --platforms android,ios . 2>&1 | tail -5

      - name: Ses tanıma modeli (Kulak)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: bash tool/model_indir.sh 2>&1 | tee /tmp/model.txt; test ${PIPESTATUS[0]} -eq 0

      - name: Paketler
        run: flutter pub get 2>&1 | tee /tmp/pub.txt

      - name: İmza anahtarını aç
        env:
          ANAHTAR_SIFRE: ${{ secrets.ANAHTAR_SIFRE }}
        run: |
          if [ -z "$ANAHTAR_SIFRE" ]; then
            # Kod denetimi ve testler yine çalışsın; APK adımında durulur.
            echo "::warning title=ANAHTAR_SIFRE eksik::Depo ayarlarına ANAHTAR_SIFRE sırrı eklenmeli (imza anahtarının kilidi)."
            echo "IMZA_YOK=1" >> $GITHUB_ENV
            exit 0
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android-keys/anahtar.enc -pass env:ANAHTAR_SIFRE | tar -x -C android-keys
          test -f android-keys/key.properties

      - name: Android'i yayına hazırla (ad, izinler, simge)
        run: |
          python3 tool/ci_android.py > /tmp/ci.txt 2>&1 || { cat /tmp/ci.txt; exit 1; }
          dart run flutter_launcher_icons 2>&1 | tail -3

      - name: Kod denetimi
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > /tmp/analyze.txt 2>&1 || {
            grep -E "^ *error" /tmp/analyze.txt | head -30 | while IFS= read -r l; do echo "::error title=analyze::$l"; done
            exit 1
          }

      - name: Testler
        run: flutter test 2>&1 | tee /tmp/test.txt; test ${PIPESTATUS[0]} -eq 0

      - name: APK
        run: |
          if [ "${IMZA_YOK:-}" = "1" ]; then
            echo "::error title=ANAHTAR_SIFRE eksik::İmza anahtarı açılamadı; APK imzalanamaz. Depoya ANAHTAR_SIFRE sırrını ekleyin."
            exit 1
          fi
          set -o pipefail
          W=android/gradle/wrapper/gradle-wrapper.properties
          sed -i -E 's#^distributionUrl=.*/(gradle-[0-9.]+-(all|bin)\.zip)#distributionUrl=https\\://services.gradle.org/distributions/\1#' $W
          flutter build apk --release --split-per-abi --build-number=${{ github.run_number }} 2>&1 | tee /tmp/apk.txt

      - name: AAB (Play Store)
        run: |
          set -o pipefail
          flutter build appbundle --release --build-number=${{ github.run_number }} 2>&1 | tee /tmp/aab.txt

      - name: AAB'yi derleme eki olarak sakla (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: HafizKardesim-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 5
          if-no-files-found: ignore

      - name: Dosyaları 'apk' dalına koy
        run: |
          mkdir -p /tmp/cikti
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk /tmp/cikti/HafizKardesim.apk
          # (Depo boyutu için yalnızca 64 bit APK konur; eski 32 bit telefonlar Play Store'daki AAB'den alır.)
          # GitHub dalına 100 MB'tan büyük dosya konamaz: büyük AAB yalnızca derleme eki (artifact) olarak kalır.
          A=build/app/outputs/bundle/release/app-release.aab
          if [ -f "$A" ] && [ "$(stat -c%s "$A")" -lt 95000000 ]; then cp "$A" /tmp/cikti/HafizKardesim.aab; fi
          # GitHub dalında dosya sınırı 100 MB: büyük APK'lar 90 MB'lık parçalara bölünür
          # (birleştirme: cat HafizKardesim.apk.parca-* > HafizKardesim.apk).
          for f in /tmp/cikti/*.apk; do
            if [ "$(stat -c%s "$f")" -gt 95000000 ]; then split -b 90m -d "$f" "$f.parca-" && rm "$f"; fi
          done
          ls -la /tmp/cikti
          (cd android && ./gradlew -q signingReport 2>/dev/null | grep -E "Variant|SHA1|SHA-256" | head -12) > /tmp/cikti/IMZA.txt || true
          cd /tmp/cikti
          echo "surum: $(grep '^version:' $GITHUB_WORKSPACE/pubspec.yaml) derleme: ${{ github.run_number }} commit: ${GITHUB_SHA::7}" > SURUM.txt
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -q -m "Derleme ${{ github.run_number }} (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk

      - name: Hata ayrıntılarını 'log' dalına yaz
        if: failure()
        run: |
          mkdir -p /tmp/log && cp /tmp/*.txt /tmp/log/ 2>/dev/null || true
          cd /tmp/log
          echo "derleme ${{ github.run_number }} commit ${GITHUB_SHA::7}" > OZET.txt
          git init -q -b log
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -q -m "Hata kaydı ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" log
