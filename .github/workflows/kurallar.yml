name: Firestore kurallarını yayınla
# firebase/firestore.rules değişince (Hatim Kardeşim + Hafız Kardeşim ortak Firebase projesi)
# kurallar Firebase'e kendiliğinden yüklenir. Giriş anahtarsızdır (Workload Identity Federation):
# Google Cloud'da "github" kimlik havuzu yalnızca bu deponun main dalına github-deploy hesabını kullandırır.
on:
  push:
    branches: [main]
    paths: ['firebase/**', '.github/workflows/kurallar.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  yayinla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Önce kuralları sahte (emülatör) veritabanında dene; bir test bile başarısızsa yayınlama.
      - name: Kural testleri
        working-directory: firebase/test
        run: |
          cp ../firestore.rules firestore.rules   # emülatör yalnızca kendi klasöründeki dosyayı okur
          npm install --no-audit --no-fund
          npx -y firebase-tools@13 emulators:exec --only firestore --project hatim-test "node test.mjs"
      # Anahtarsız giriş: GitHub, Google Cloud'daki "github" kimlik havuzu üzerinden yalnızca bu deponun
      # main dalı için github-deploy hizmet hesabı yetkisiyle çalışır (indirilmiş gizli anahtar yok).
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/668036405824/locations/global/workloadIdentityPools/github/providers/hafiz-repo
          service_account: github-deploy@hatim-kardesim.iam.gserviceaccount.com
      - name: Kuralları yayınla
        run: npx -y firebase-tools@latest deploy --only firestore:rules --project hatim-kardesim --non-interactive
