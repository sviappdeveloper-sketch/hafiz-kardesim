name: Firebase Hosting yayınla
# hatim-kardesim.firebaseapp.com/.well-known/assetlinks.json: Firebase e-postalarındaki şifre yenileme
# bağlantıları Android'de doğrudan Hatim Kardeşim uygulamasını açsın diye (doğrulanmış uygulama bağlantısı).
on:
  push:
    branches: [main]
    paths: ['firebase/hosting/**', '.github/workflows/hosting.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  yayinla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: firebase/hosting
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Anahtarsız giriş: GitHub, Google Cloud'daki "github" kimlik havuzu üzerinden yalnızca bu deponun
      # main dalı için github-deploy hizmet hesabı yetkisiyle çalışır (indirilmiş gizli anahtar yok).
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/668036405824/locations/global/workloadIdentityPools/github/providers/hafiz-repo
          service_account: github-deploy@hatim-kardesim.iam.gserviceaccount.com
      - name: Hosting'i yayınla
        run: npx -y firebase-tools@latest deploy --only hosting --project hatim-kardesim --non-interactive
