<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Hafız Kardeşim</title>
<style>
:root{--bg:#f3f0e6;--card:#fffdf7;--tx:#1d2a26;--mu:#6b7a73;--ac:#0f766e;--ac2:#0b5e57;--gd:#b7862b;--bd:#e3dccb;--in:#f8f5ec;--ok:#0f766e;--er:#c2410c;--sk:#d97706;--hn:#2563eb;--hid:#ddd5c2;
--ar:"KFGQPC Uthmanic Script HAFS","Amiri Quran","Scheherazade New","Noto Naskh Arabic","Geeza Pro","Traditional Arabic","DejaVu Sans",serif;
--hf:"Avenir Next","Segoe UI",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0c1715;--card:#13221f;--tx:#e8f0ec;--mu:#8fa39b;--ac:#2dd4bf;--ac2:#0f766e;--gd:#e0b25a;--bd:#22372f;--in:#0f1d1a;--ok:#5eead4;--er:#fb923c;--sk:#fbbf24;--hn:#93c5fd;--hid:#2a3d37}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0c1715;--card:#13221f;--tx:#e8f0ec;--mu:#8fa39b;--ac:#2dd4bf;--ac2:#0f766e;--gd:#e0b25a;--bd:#22372f;--in:#0f1d1a;--ok:#5eead4;--er:#fb923c;--sk:#fbbf24;--hn:#93c5fd;--hid:#2a3d37}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.45 -apple-system,system-ui,sans-serif}
main{max-width:600px;margin:0 auto;padding:14px 14px 40px}
h1{font:700 26px var(--hf);margin:0}
h2{font:700 18px var(--hf);margin:18px 0 8px;color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
button{font:600 15px -apple-system,system-ui,sans-serif;border:0;border-radius:10px;padding:10px 14px;background:var(--ac2);color:#fff;cursor:pointer}
button:disabled{opacity:.45}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.d{background:transparent;color:var(--er);border:1px solid var(--bd)}
button.gd{background:var(--gd);color:#fff}
input[type=text],input[type=number],select{font:inherit;width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--in);color:var(--tx)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.back{background:transparent;color:var(--ac);padding:6px 0;font-weight:600}
.mu{color:var(--mu);font-size:14px}
.c{text-align:center}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.btns button{flex:1;padding:10px;font-size:14px;min-width:30%}
.lbl{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mu);margin:14px 0 6px;font-weight:700}
.tg{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--in);color:var(--mu);margin:0 4px 4px 0;border:1px solid var(--bd)}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden;margin-bottom:10px}
.seg button{flex:1;border-radius:0;background:var(--card);color:var(--mu);padding:9px 4px;font-size:14px}
.seg button.on{background:var(--ac2);color:#fff}
/* açılış */
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);transition:opacity .45s}
#splash img{width:128px;height:128px;border-radius:30px;box-shadow:0 10px 30px rgba(0,0,0,.18);animation:pop .6s ease-out}
#splash .t{font:700 30px var(--hf)}
#splash .a{font:400 26px var(--ar);color:var(--gd)}
#splash.off{opacity:0;pointer-events:none}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
/* menü */
.hero{display:flex;align-items:center;gap:14px;margin:8px 0 14px}
.hero img{width:64px;height:64px;border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.today{display:flex;gap:14px;align-items:center}
.ring{width:84px;height:84px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 20px var(--hf)}
.ring b small{font:400 11px system-ui;color:var(--mu)}
.st3{display:flex;gap:6px;flex:1}
.st3>div{flex:1;background:var(--in);border-radius:10px;padding:8px 4px;text-align:center}
.st3 b{display:block;font:700 20px var(--hf)}
.st3 small{color:var(--mu);font-size:12px}
.big{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;margin-bottom:10px;border-radius:14px;font-size:17px}
.big .ic{font-size:28px;line-height:1;width:34px;text-align:center}
.big small{display:block;font-weight:400;font-size:13.5px;opacity:.85;margin-top:2px}
.big.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.big.alt small{color:var(--mu)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .big{flex-direction:column;align-items:flex-start;gap:6px;margin:0;padding:14px}
.due{border-left:4px solid var(--gd)}
/* sure listesi */
.sl{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--bd);cursor:pointer}
.sl:last-child{border:0}
.sl .no{width:34px;height:34px;flex:none;border-radius:50%;background:var(--in);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font:700 13px var(--hf);color:var(--ac)}
.sl .nm{flex:1;min-width:0}
.sl .nm b{display:block}
.sl .ar{font:400 21px var(--ar);color:var(--gd);white-space:nowrap}
.sl.on{background:rgba(15,118,110,.1);border-radius:10px}
.bar{height:5px;border-radius:3px;background:var(--in);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--ac)}
.cz{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cz button{padding:10px 0;background:var(--card);color:var(--tx);border:1px solid var(--bd);position:relative;overflow:hidden}
.cz button.on{background:var(--ac2);color:#fff}
.cz button i{position:absolute;left:0;bottom:0;height:4px;background:var(--gd)}
/* okuma */
.mus{direction:rtl;text-align:justify;text-align-last:right;font-family:var(--ar);font-size:var(--fs,28px);line-height:2.15;word-spacing:2px}
.mus .w{border-radius:6px;padding:0 1px;transition:background .2s,color .2s;cursor:pointer}
.mus .w.h{color:transparent;background:var(--hid)}
.mus.harf .w.h{background:transparent;color:transparent}
.mus.harf .w.h i{font-style:normal;color:var(--mu)}
.mus.silik .w.h{background:transparent;color:var(--tx);opacity:.13}
.mus .w.cur{outline:2px dashed var(--gd);outline-offset:2px;animation:pl 1.3s infinite}
@keyframes pl{50%{outline-color:transparent}}
.mus .w.ok{color:var(--tx)}
.mus .w.er{color:var(--er);text-decoration:underline wavy var(--er);text-underline-offset:9px}
.mus .w.sk{color:var(--sk);text-decoration:underline dotted var(--sk);text-underline-offset:9px}
.mus .w.hn{color:var(--hn)}
.mus .pm{color:var(--gd);font-size:.7em}
.mus .an{color:var(--gd);font-size:.85em;white-space:nowrap;padding:0 3px}
.mus .an.on{background:rgba(183,134,43,.18);border-radius:8px}
.sh{direction:rtl;text-align:center;font:400 22px var(--ar);color:var(--gd);margin:6px 0 2px}
.shs{direction:ltr;text-align:center;font:700 13px var(--hf);color:var(--mu);letter-spacing:.05em;margin-top:8px}
.bsm{direction:rtl;text-align:center;font:400 calc(var(--fs,28px)*.85) var(--ar);color:var(--mu);margin-bottom:4px}
.dock{position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(6px + env(safe-area-inset-bottom,0px));margin-top:10px;border-top:1px solid var(--bd)}
.heard{direction:rtl;text-align:right;font:400 18px var(--ar);color:var(--mu);min-height:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mic{width:72px;height:72px;border-radius:50%;font-size:30px;padding:0;flex:none;box-shadow:0 6px 18px rgba(15,118,110,.35)}
.mic.on{background:var(--er);animation:mp 1.4s infinite}
@keyframes mp{0%{box-shadow:0 0 0 0 rgba(194,65,12,.5)}70%{box-shadow:0 0 0 18px rgba(194,65,12,0)}100%{box-shadow:0 0 0 0 rgba(194,65,12,0)}}
.dk{display:flex;gap:8px;align-items:center}
.dk .sm{flex:1;padding:12px 4px;font-size:13.5px}
.pg{height:6px;background:var(--in);border-radius:3px;overflow:hidden;margin:6px 0 10px;border:1px solid var(--bd)}
.pg i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--gd));transition:width .3s}
.kd{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kd button{padding:16px 6px;font-size:16px}
.kd .ok{background:var(--ok);color:#fff}
.kd .er{background:var(--er);color:#fff}
.lg{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mu);margin:4px 0}
.lg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:var(--c)}
/* sonuç */
.score{font:800 56px var(--hf);color:var(--ac);text-align:center;line-height:1.1}
.st4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin:10px 0}
.st4>div{background:var(--in);border-radius:10px;padding:8px 2px}
.st4 b{display:block;font:700 20px var(--hf)}
.st4 small{font-size:11.5px;color:var(--mu)}
.el{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
.el:last-child{border:0}
.el .ar{font:400 24px var(--ar);direction:rtl}
/* dinle */
.ay{padding:10px 6px;border-bottom:1px solid var(--bd);border-radius:10px;cursor:pointer}
.ay.on{background:rgba(15,118,110,.12)}
.ay .t{direction:rtl;text-align:right;font:400 var(--fs,28px)/2 var(--ar)}
.ay .t.gz{filter:blur(7px)}
.ay .m{font-size:14px;color:var(--mu);margin-top:4px}
.pl{display:flex;gap:8px;align-items:center;justify-content:center;margin:8px 0}
.pl button{min-width:56px;font-size:20px;padding:10px}
.pl .pp{width:64px;height:64px;border-radius:50%;font-size:26px}
.wait{text-align:center;font-weight:700;color:var(--gd);min-height:22px}
/* ilerleme */
.hm{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.hm i{aspect-ratio:1;border-radius:3px;background:var(--in);border:1px solid var(--bd)}
.hm i.l1{background:rgba(15,118,110,.3)}.hm i.l2{background:rgba(15,118,110,.55)}.hm i.l3{background:rgba(15,118,110,.8)}.hm i.l4{background:var(--gd)}
.cmap{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.cmap div{border-radius:8px;padding:8px 0;text-align:center;font:700 13px var(--hf);border:1px solid var(--bd);background:var(--in)}
.cmap small{display:block;font:400 10.5px system-ui;color:var(--mu)}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90%;text-align:center;animation:pop .25s}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--card);width:100%;max-width:600px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sw{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);gap:10px}
.sw:last-child{border:0}
.sw select,.sw input{width:auto;max-width:55%}
.res{padding:10px 0;border-bottom:1px solid var(--bd)}
.res:last-child{border:0}
.res .t{direction:rtl;text-align:right;font:400 22px/1.9 var(--ar)}
</style></head><body>
<div id="splash"><img src="logo.png" alt=""><div class="t">Hafız Kardeşim</div><div class="a">حَافِظْ</div></div>

<div id="ov"></div>
<script src="quran.js"></script>
<script>
"use strict";
var $=function(s){return document.querySelector(s)};
/* ---------- Kur'an verisi ---------- */
var TR=["Fâtiha","Bakara","Âl-i İmrân","Nisâ","Mâide","En'âm","A'râf","Enfâl","Tevbe","Yûnus","Hûd","Yûsuf","Ra'd","İbrâhîm","Hicr","Nahl","İsrâ","Kehf","Meryem","Tâhâ","Enbiyâ","Hac","Mü'minûn","Nûr","Furkân","Şuarâ","Neml","Kasas","Ankebût","Rûm","Lokmân","Secde","Ahzâb","Sebe'","Fâtır","Yâsîn","Sâffât","Sâd","Zümer","Mü'min","Fussilet","Şûrâ","Zuhruf","Duhân","Câsiye","Ahkâf","Muhammed","Fetih","Hucurât","Kâf","Zâriyât","Tûr","Necm","Kamer","Rahmân","Vâkıa","Hadîd","Mücâdele","Haşr","Mümtehine","Saf","Cuma","Münâfikûn","Teğâbün","Talâk","Tahrîm","Mülk","Kalem","Hâkka","Meâric","Nûh","Cin","Müzzemmil","Müddessir","Kıyâme","İnsân","Mürselât","Nebe'","Nâziât","Abese","Tekvîr","İnfitâr","Mutaffifîn","İnşikâk","Bürûc","Târık","A'lâ","Gâşiye","Fecr","Beled","Şems","Leyl","Duhâ","İnşirâh","Tîn","Alak","Kadir","Beyyine","Zilzâl","Âdiyât","Kâria","Tekâsür","Asr","Hümeze","Fîl","Kureyş","Mâûn","Kevser","Kâfirûn","Nasr","Tebbet","İhlâs","Felak","Nâs"];

function an(n){return String(n).replace(/[0-9]/g,function(d){return"٠١٢٣٤٥٦٧٨٩"[d]})}

function nrm(w){return String(w).replace(HAR,"").replace(/[ٱأإآٲٳ]/g,"ا").replace(/ة/g,"ه").replace(/[ىی]/g,"ي").replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/ء/g,"").replace(/ک/g,"ك").replace(/[^\u0621-\u064A]/g,"")}

function lev(a,b){if(a===b)return 0;var m=a.length,n=b.length;if(!m)return n;if(!n)return m;var p=[],i,j;for(j=0;j<=n;j++)p[j]=j;
  for(i=1;i<=m;i++){var q=[i];for(j=1;j<=n;j++)q[j]=Math.min(p[j]+1,q[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=q}return p[n]}

var MUQ={"الم":1,"المص":1,"الر":1,"المر":1,"كهيعص":1,"طه":1,"طسم":1,"طس":1,"يس":1,"ص":1,"حم":1,"عسق":1,"ق":1,"ن":1};

var GIRIS={"اعوذ":1,"بالله":1,"من":1,"الشيطان":1,"الرجيم":1,"بسم":1,"الله":1,"الرحمن":1,"الرحيم":1};
/* ---------- kayıt ---------- */
var DB={ay:{},days:{},err:[],hist:[],set:{goal:10,hide:"gizli",fs:28,meal:1,rec:"Husary_Muallim_128kbps",th:"",lang:"ar-SA",bs:1},last:null,n:0};
try{var o=JSON.parse(localStorage.getItem("hk1")||"null");if(o&&o.ay){for(var k in o)DB[k]=o[k];for(k in{goal:1,hide:1,fs:1,meal:1,rec:1,th:1,lang:1,bs:1})if(o.set[k]===undefined)o.set[k]={goal:10,hide:"gizli",fs:28,meal:1,rec:"Husary_Muallim_128kbps",th:"",lang:"ar-SA",bs:1}[k]}}catch(e){}

var DAY=864e5;
function dkey(t){var d=new Date(t);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function today0(){var d=new Date();d.setHours(0,0,0,0);return d.getTime()}

function trn(t){return String(t).toLocaleLowerCase("tr").replace(/[âä]/g,"a").replace(/[îı]/g,"i").replace(/[ûü]/g,"u").replace(/ö/g,"o").replace(/ç/g,"c").replace(/ş/g,"s").replace(/ğ/g,"g").replace(/[^a-z0-9]/g,"")}

// birbirini izleyen ayetleri "Sure a–b" parçalarına ayır
function chunks(L){var out=[],c=null;L.forEach(function(i){if(c&&i===c.b+1&&A[i][0]===A[c.a][0])c.b=i;else{c={a:i,b:i};out.push(c)}});return out}

  if(a[0]===b[0])return sn(a[0])+" "+(a[1]===b[1]?a[1]:a[1]+"–"+b[1]);return sn(a[0])+" "+a[1]+" – "+sn(b[0])+" "+b[1]}
function range(i,j){var L=[];for(var k=i;k<=j;k++)L.push(k);return L}
/* ---------- ekran yönetimi ---------- */
var V={v:"menu"},S=null,P=null;
function go(v,x){if(V.v==="rec"&&v!=="res")Ses.stop();if(V.v==="listen"&&v!=="listen")plStop();V={v:v};for(var k in x||{})V[k]=x[k];window.scrollTo(0,0);render()}
function head(t,right,back){return'<div class="top"><button class="back" onclick="'+(back||"go(\'menu\')")+'">← '+(back?"Geri":"Ana menü")+"</button>"+(right||"")+'</div><h1 style="margin-bottom:8px">'+t+"</h1>"}
function render(){var f={menu:menu,pick:pick,rec:recV,res:resV,listen:listenV,search:searchV,prog:progV,errs:errsV,set:setV,help:helpV}[V.v]||menu;$("#app").innerHTML=f();if(V.v==="rec")afterRec();if(V.v==="listen")plPaint()}
function back(){if(document.querySelector(".sheet")){closeSheet();return"ok"}if(V.v==="menu")return"exit";var b=document.querySelector(".top .back");if(b)b.click();else go("menu");return"ok"}
/* ---------- ana menü ---------- */
function menu(){
