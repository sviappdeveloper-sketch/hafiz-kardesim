name: hafiz_kardesim
description: "Hafız Kardeşim — Kur'an ezberini dinletme uygulaması"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_fonts: ^6.2.1
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  audio_session: ^0.1.16
  share_plus: ^10.1.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2
  google_sign_in: ^6.2.2
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  path_provider: ^2.1.4
  home_widget: ^0.7.0
  in_app_update: ^4.2.3
  flutter_compass: ^0.8.1
  image_picker: ^1.1.2
  image: ^4.2.0
  speech_to_text: ^7.0.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/logo/
    - assets/quran/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#03301C"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  min_sdk_android: 23
