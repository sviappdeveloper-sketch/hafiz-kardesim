<!doctype html><html lang="tr"><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri&family=Manrope:wght@400;600;700;800&family=Sora:wght@600;700&display=swap');
:root{--deep:#02060F;--ink:#050E20;--soft:#0A1A36;--line:#1B3462;--gold:#CDD5E1;--gl:#F2F5FA;--iv:#EDF1F7;--mu:#8D9DBA;--rd:#6FA8E8;--ok:#86C29A;--er:#E08A78;--sk:#E0A030}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100vw;height:100vh;overflow:hidden;background:var(--deep)}
body{font-family:Manrope,system-ui,sans-serif;color:var(--iv)}
.shot{position:relative;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(120% 70% at 50% 0%,#123E80 0%,#071A3D 45%,#02060F 100%)}
.cap{position:absolute;top:44px;left:26px;right:26px;text-align:center}
.cap h1{font:700 30px/1.15 Sora,sans-serif;letter-spacing:-.4px}
.cap h1 b{color:var(--gold);font-weight:700}
.cap p{margin-top:10px;font:500 15px/1.4 Manrope;color:var(--mu)}
.phone{position:absolute;left:30px;right:30px;top:186px;height:calc(100vh - 204px);border-radius:44px;background:var(--ink);border:7px solid #070b12;box-shadow:0 30px 60px rgba(0,0,0,.55),0 0 0 1px rgba(205,213,225,.25);overflow:hidden}
.scr{position:absolute;inset:0;padding:40px 14px 0;background:radial-gradient(100% 60% at 50% 0%,#0C2550,var(--ink) 60%)}
.notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:96px;height:26px;border-radius:14px;background:#000}
.bar{display:flex;align-items:center;gap:8px;margin:2px 2px 10px}
.bar .t{font:700 17px Sora;flex:1}
.bar .ic{color:var(--gl);font-size:18px}
.pg{height:4px;border-radius:2px;background:var(--line);margin:0 2px 10px;overflow:hidden}.pg i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--gold))}
.lbl{font:700 9.5px Manrope;letter-spacing:1.6px;color:var(--mu);text-align:center;margin:6px 0 2px}
.sname{font:400 20px 'Amiri Quran',Amiri,serif;color:var(--gold);text-align:center}
.bsm{font:400 17px 'Amiri Quran',Amiri,serif;color:var(--mu);text-align:center;margin-bottom:2px}
.mus{direction:rtl;text-align:justify;text-align-last:right;font:400 21px/2.25 'Amiri Quran',Amiri,serif}
.w{padding:0 2px;border-radius:6px}
.w.g{color:transparent;background:linear-gradient(var(--line),var(--line)) center/100% 52% no-repeat;border-radius:8px}
.w.c{color:transparent;background:linear-gradient(var(--line),var(--line)) center/100% 52% no-repeat;box-shadow:inset 0 0 0 2px var(--gold);border-radius:8px}
.w.o{color:var(--iv)}.w.og{color:rgba(237,241,247,.55)}.w.oc{color:rgba(237,241,247,.55);outline:2px solid var(--gold);outline-offset:1px}
.w.e{color:var(--er);text-decoration:underline wavy var(--er);text-underline-offset:7px}
.w.k{color:var(--sk);text-decoration:underline dotted var(--sk);text-underline-offset:7px}
.w.h{color:var(--rd)}
.pm{color:var(--gold);font-size:14px}.an{color:var(--gold);font-size:17px;white-space:nowrap}
.dock{position:absolute;left:0;right:0;bottom:0;padding:8px 10px 18px;background:rgba(2,6,15,.97);border-top:1px solid rgba(205,213,225,.25)}
.heard{direction:rtl;font:400 15px/28px 'Amiri Quran',Amiri,serif;color:var(--mu);text-align:right;height:30px;overflow:hidden;white-space:nowrap}
.row{display:flex;align-items:center;gap:6px}
.sb{flex:1;text-align:center;font:600 10px/1.2 Manrope;color:var(--iv)}.sb span{display:block;color:var(--gl);font-size:17px;margin-bottom:2px}
.mic{width:62px;height:62px;border-radius:50%;background:var(--er);display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 0 0 10px rgba(224,138,120,.18),0 0 0 20px rgba(224,138,120,.08)}
.fin{text-align:center;color:var(--gl);font:600 11.5px Manrope;margin-top:8px}
.lg{display:flex;gap:10px;justify-content:center;margin:8px 0;font:500 10px Manrope;color:var(--mu)}.lg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px}
.card{background:rgba(2,6,15,.45);border:1px solid rgba(205,213,225,.3);border-radius:16px;padding:12px;margin-bottom:9px}
.card.hl{border-color:rgba(205,213,225,.7);background:rgba(205,213,225,.08)}
.gbtn{display:block;text-align:center;border-radius:12px;padding:10px;font:700 12.5px Manrope;background:linear-gradient(90deg,var(--gl),var(--gold));color:var(--deep)}
.obtn{display:block;text-align:center;border-radius:12px;padding:9px;font:700 12.5px Manrope;border:1px solid rgba(205,213,225,.6);color:var(--gl)}
.big2{display:flex;gap:8px}.big2 div{flex:1;text-align:center;border-radius:14px;padding:14px 0;font:700 15px Manrope;color:#fff}
.mu{color:var(--mu)}
.st{display:flex;gap:6px}.st div{flex:1;background:rgba(2,6,15,.5);border:1px solid var(--line);border-radius:12px;text-align:center;padding:8px 2px}.st b{display:block;font:800 17px Manrope;color:var(--gl)}.st small{font-size:9.5px;color:var(--mu)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tiles div{border-radius:14px;padding:10px;border:1px solid rgba(205,213,225,.35);background:rgba(2,6,15,.45)}.tiles div.f{background:rgba(205,213,225,.13);border-color:rgba(205,213,225,.6)}.tiles b{display:block;font:700 12.5px Manrope;margin-top:4px}.tiles small{font-size:10px;color:var(--mu)}.tiles .i{font-size:18px}
.nav{position:absolute;left:0;right:0;bottom:0;height:62px;background:rgba(2,6,15,.97);border-top:1px solid rgba(205,213,225,.25);display:flex;align-items:center;justify-content:space-around;font:600 9px Manrope;color:var(--mu)}
.nav div{text-align:center}.nav .on{color:var(--gold)}.nav .c{width:46px;height:46px;border-radius:50%;background:linear-gradient(90deg,var(--gl),var(--gold));display:flex;align-items:center;justify-content:center;font-size:22px;margin-top:-26px;color:var(--deep)}
.ay{border-radius:12px;padding:8px 10px;margin-bottom:6px;border:1px solid var(--line);background:rgba(2,6,15,.3)}.ay.on{border-color:rgba(205,213,225,.6);background:rgba(205,213,225,.1)}
.ay .ar{direction:rtl;font:400 19px/2 'Amiri Quran',Amiri,serif}.ay .m{font-size:10.5px;color:var(--mu);line-height:1.35}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:12px}.kv b{color:var(--gl)}
.hm{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px}.hm i{display:block;width:100%;aspect-ratio:1;border-radius:3px;background:rgba(27,52,98,.6)}
.cz{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.cz div{border-radius:7px;text-align:center;padding:5px 0;font:800 11px Manrope;border:1px solid var(--line)}.cz small{display:block;font:500 8.5px Manrope;color:var(--mu)}
</style></head><body><div id="r"></div><script>
