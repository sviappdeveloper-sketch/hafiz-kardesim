# Hafız Kardeşim — Codemagic iş akışları (iPhone derleme + App Store Connect, isteğe bağlı Google Play yükleme).
# Gizli değer: Codemagic'te bu uygulamanın "asc" grubunda ASC_KEY_P8 (Hatim Kardeşim / Turnuva Fikstürü'nde kullanılan
# App Store Connect .p8 anahtarının tamamı, Secure). İnceleme telefonu için aynı gruba ASC_TEL (+905xxxxxxxxx).
# Android APK/AAB GitHub Actions'ta derlenir (.github/workflows/derle.yml); burada Mac dakikası harcanmaz.
workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - asc
      vars:
        ASC_KEY_ID: 683B6FR7DT
        ASC_ISSUER_ID: 195bfec6-edd0-4a8e-8cd8-6a1d5d51bb6e
        APPLE_TEAM_ID: GS55JS3WKJ
        P12_PASS: hafiz-ci-gecici
        BUNDLE_ID: com.sviapp.hafizKardesim
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Platform dosyalarını oluştur
        script: flutter create --org com.sviapp --project-name hafiz_kardesim --platforms android,ios .
      - name: Paketler
        script: flutter pub get
      - name: iOS'u yayına hazırla (ad, mikrofon/konuşma izinleri, Apple ile Giriş)
        script: python3 tool/ci_ios.py
      - name: Uygulama simgeleri
        script: dart run flutter_launcher_icons
      - name: Testler
        script: flutter test
      - name: Sertifika ve App Store profili (paket kimliği yoksa oluşturulur)
        script: |
          set -e
          export RUNNER_TEMP=$HOME/imza GITHUB_ENV=$HOME/imza/env
          mkdir -p $RUNNER_TEMP
          pip3 install --quiet pyjwt cryptography || pip3 install --quiet --break-system-packages pyjwt cryptography
          python3 tool/ios_signing.py
          keychain initialize
          keychain add-certificates --certificate $RUNNER_TEMP/dagitim.p12 --certificate-password "$P12_PASS"
          UUID=$(grep '^PROFILE_UUID=' $GITHUB_ENV | cut -d= -f2-)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp $RUNNER_TEMP/profil.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          xcode-project use-profiles
      - name: iPhone paketi (IPA)
        script: |
          flutter build ipa --release \
            --build-number=$((1 + ${BUILD_NUMBER:-0})) \
            --export-options-plist=$HOME/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $ASC_KEY_P8
        key_id: 683B6FR7DT
        issuer_id: 195bfec6-edd0-4a8e-8cd8-6a1d5d51bb6e
        submit_to_testflight: false

  # Mağaza sayfası: ad, alt başlık, açıklama, anahtar kelimeler, ekran görüntüleri, kategori, yaş, inceleme notu,
  # derlemeyi sürüme bağlama. Metinler: app-store/metadata.json. İncelemeye GÖNDERMEZ.
  asc-sayfa:
    name: "App Store: sayfayı hazırla"
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      groups:
        - asc
      vars:
        ASC_KEY_ID: 683B6FR7DT
        ASC_ISSUER_ID: 195bfec6-edd0-4a8e-8cd8-6a1d5d51bb6e
    scripts:
      - name: Mağaza sayfası
        script: |
          pip3 install --quiet pyjwt cryptography || pip3 install --quiet --break-system-packages pyjwt cryptography
          python3 tool/asc_islem.py

  # Aynısı + sürümü Apple incelemesine gönderir.
  asc-gonder:
    name: "App Store: incelemeye gönder"
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - asc
      vars:
        ASC_KEY_ID: 683B6FR7DT
        ASC_ISSUER_ID: 195bfec6-edd0-4a8e-8cd8-6a1d5d51bb6e
        GONDER: evet
    scripts:
      - name: Hazırla ve incelemeye gönder
        script: |
          pip3 install --quiet pyjwt cryptography || pip3 install --quiet --break-system-packages pyjwt cryptography
          python3 tool/asc_islem.py
